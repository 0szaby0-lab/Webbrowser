[supervisord]
nodaemon=true
user=root

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 1280x720x16
autorestart=true
priority=10

[program:openbox]
command=/bin/bash -c "sleep 1 && /usr/bin/openbox"
autorestart=true
priority=20

[program:x11vnc]
command=/bin/bash -c "sleep 2 && /usr/bin/x11vnc -display :0 -nopw -listen 127.0.0.1 -rfbport 5900 -forever -shared"
autorestart=true
priority=30

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc %(ENV_PORT)s 127.0.0.1:5900
autorestart=true
priority=40

[program:chromium]
command=/bin/bash -c "sleep 4 && /usr/bin/chromium --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-software-rasterizer --window-size=1280,720 --window-position=0,0 https://discord.com/login"
autorestart=true
priority=50
